name: Build Windows executable

# Produces a real VeilShareEdge.exe on GitHub's own Windows runners (not a
# local fake build) so judges can download a packaged app without installing
# Python. Runs on every push to main and can be triggered manually.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Generate demo inputs
        run: python scripts/generate_demo_inputs.py

      - name: Build VeilShareEdge.exe
        run: pyinstaller packaging/veilshare_edge.spec --noconfirm --clean

      - name: Zip build output
        run: Compress-Archive -Path dist/VeilShareEdge/* -DestinationPath VeilShareEdge-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeilShareEdge-windows
          path: VeilShareEdge-windows.zip
          retention-days: 30
